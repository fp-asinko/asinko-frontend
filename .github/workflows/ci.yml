# Quality gates (docs/ai-guidelines/tooling.md § Quality gates en CI). All blocking.
name: CI

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Preview-like build with mocks: no secrets and no backend needed (specs/foundation/design.md §13).
env:
  APP_ENV: preview
  API_MOCKS: 'true'
  API_BASE_URL: http://localhost:9
  NEXT_PUBLIC_SITE_URL: http://localhost:3100
  LEFTHOOK: '0'

jobs:
  quality:
    name: Format, lint, types, tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Organization accounts need GITLEAKS_LICENSE (free); personal accounts do not.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      # No pnpm cache here: this job never installs, so the store does not exist and the cache
      # post step fails. pnpm audit only reads the lockfile.
      # A high or critical vulnerability blocks the merge (libraries.md).
      - run: pnpm audit --audit-level high
