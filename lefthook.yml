# Git hooks (docs/ai-guidelines/tooling.md). CI is the source of truth; these are a local aid.
pre-commit:
  parallel: true
  commands:
    eslint:
      glob: '*.{js,mjs,ts,tsx}'
      run: pnpm exec eslint --max-warnings=0 {staged_files}
    prettier:
      glob: '*.{js,mjs,ts,tsx,json,css,md,yml,yaml}'
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
