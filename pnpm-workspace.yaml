allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  lefthook: false
  sharp: false
  unrs-resolver: false

# Patched versions of transitive dev dependencies that their parents have not picked up yet
# (pnpm audit in CI). Remove each one once `pnpm why <name>` shows the parent ships the fix.
overrides:
  'handlebars@<4.7.10': ^4.7.10 # GHSA-8r5x-fm3f-whwj, GHSA-p8wg-vrv2-v86f, via eslint-plugin-boundaries
  'body-parser@>=2.0.0 <2.4.0': ^2.4.0 # GHSA-27r3-jxmh-p828, via shadcn (@modelcontextprotocol/sdk > express)
  'undici@>=7.18.0 <7.30.1': ^7.30.1 # GHSA-xjj6-f33q-929c, via shadcn (@dotenvx/dotenvx, @shadcn/registry)
  'undici@>=8.0.0 <8.12.2': ^8.12.2 # GHSA-xjj6-f33q-929c, via jsdom (vitest)
  'zod@>=4.0.0 <4.6.6': ^4.6.6 # GHSA-mrhx-c7xc-m3w5, via shadcn (@modelcontextprotocol/sdk); ours is direct
  'ip-address@<10.7.4': ^10.7.4 # moderate, via shadcn (@shadcn/registry > socks)
  'systeminformation@<5.33.16': ^5.33.16 # high, Windows command injection, via shadcn (@dotenvx/dotenvx)

# Advisories without a fix yet. Each one only reaches dev tooling, never the site; review them when
# their package ships a patch.
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3, stack exhaustion with deeply nested patterns (2026-09-18). No patched version
    # exists. It only expands our own globs (ESLint, shadcn CLI), never user input.
    - GHSA-vfj7-8cjw-p6xm
